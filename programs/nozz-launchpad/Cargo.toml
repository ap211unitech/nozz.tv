[package]
name = "nozz-launchpad"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "nozz_launchpad"
doctest = false

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = { version = "0.32.1", features = ['init-if-needed'] }
anchor-spl = { version = "0.32.1", features = [
    "token_2022",
    "token_2022_extensions",
] }
raydium-cp-swap = { git = "https://github.com/raydium-io/raydium-cp-swap", rev = "609780f165d234a0aa9699cac90178a3fa36fd43", features = [
    "cpi",
] }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
] }
